    </symbol>
  </defs>

  <rect width="1536" height="1024" fill="#151516"/>

  <g transform="translate(116 126)">
    <circle cx="222" cy="222" r="222" fill="#8d8d93"/>
    <path d="M0 222A222 222 0 0 1 222 0v444A222 222 0 0 1 0 222Z" fill="#e9e9eb"/>
    <use href="#accent" x="186" y="186" width="72" height="72"/>
  </g>

  <g transform="translate(594 126)">
    <path d="M0 0h340v118H118v222H0Z" fill="#e9e9eb"/>
    <rect x="118" y="118" width="222" height="222" fill="#8d8d93"/>
